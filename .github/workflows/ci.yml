name: ci

on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 22.19.0 is the exact minimum pi 1.3.0 declares; 24 is the current runtime.
        node: ['22.19.0', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      # No network model calls anywhere: every provider is an in-process fixed stream.
      - run: npm test
      - run: npm run test:known
      - run: npm run test:sdk
