<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif">
  <rect x="0" y="0" width="1280" height="360" fill="#ffffff"/>

  <text x="640" y="52" font-size="26" font-weight="bold" fill="#1a202c" text-anchor="middle">黑板更新循环（每个用户回合）</text>
  <text x="640" y="86" font-size="15" fill="#5a6a80" text-anchor="middle">确定性抽取 → 草稿 → 代理自己审校提交；唯一的 LLM 步骤是代理的回合本身</text>

  <!-- node 1: turn settled (gray, harness) -->
  <rect x="40" y="140" width="240" height="88" rx="10" fill="#f7f9fb" stroke="#94a3b8" stroke-width="2"/>
  <text x="160" y="170" font-size="20" font-weight="bold" fill="#2d3748" text-anchor="middle">回合结束</text>
  <text x="160" y="198" font-size="15" fill="#5a6a80" text-anchor="middle">每个用户回合跑完时</text>

  <!-- node 2: deterministic extraction (green) -->
  <rect x="360" y="140" width="240" height="88" rx="10" fill="#eefaf3" stroke="#22a06b" stroke-width="2"/>
  <text x="480" y="170" font-size="20" font-weight="bold" fill="#1e7a4c" text-anchor="middle">确定性抽取</text>
  <text x="480" y="198" font-size="15" fill="#5a6a80" text-anchor="middle">只扫新增条目 · 零模型</text>

  <!-- node 3: checkpoint draft (green) -->
  <rect x="680" y="140" width="240" height="88" rx="10" fill="#eefaf3" stroke="#22a06b" stroke-width="2"/>
  <text x="800" y="170" font-size="20" font-weight="bold" fill="#1e7a4c" text-anchor="middle">checkpoint 草稿</text>
  <text x="800" y="198" font-size="15" fill="#5a6a80" text-anchor="middle">搭下条用户提示投递</text>

  <!-- node 4: agent curation (orange = the only LLM step) -->
  <rect x="1000" y="140" width="240" height="88" rx="10" fill="#fdeacc" stroke="#e8850c" stroke-width="2"/>
  <text x="1120" y="170" font-size="20" font-weight="bold" fill="#9a4d00" text-anchor="middle">代理审校提交</text>
  <text x="1120" y="198" font-size="15" fill="#5a6a80" text-anchor="middle">commit · supersedes · skip</text>

  <!-- forward arrows: edge center to edge center, mid-height y=184 -->
  <line x1="280" y1="184" x2="346" y2="184" stroke="#718096" stroke-width="2.5"/>
  <polygon points="346,176 346,192 360,184" fill="#718096"/>
  <line x1="600" y1="184" x2="666" y2="184" stroke="#718096" stroke-width="2.5"/>
  <polygon points="666,176 666,192 680,184" fill="#718096"/>
  <line x1="920" y1="184" x2="986" y2="184" stroke="#718096" stroke-width="2.5"/>
  <polygon points="986,176 986,192 1000,184" fill="#718096"/>

  <!-- loop return: node 4 bottom center -> node 1 bottom center (dashed) -->
  <path d="M 1120,228 L 1120,300 L 160,300 L 160,242" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/>
  <polygon points="152,242 168,242 160,228" fill="#94a3b8"/>
  <text x="640" y="330" font-size="15" fill="#5a6a80" text-anchor="middle">commit 落盘 board.md（溢出转归档文件）；下一回合只取新增条目</text>
</svg>
